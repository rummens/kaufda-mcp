[project]
name = "kaufda-mcp"
version = "0.6.2"
description = "MCP Server für kaufDA: Angebote suchen, Prospekte ansehen und den Wocheneinkauf zusammenstellen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Exact pins (= uv.lock): uvx --from git+... ignores uv.lock, so ranges would float.
    "mcp==1.30.0",
    "httpx==0.28.1",
    "tzdata==2026.5",
    "pillow==12.3.0",
    "keyring==25.7.0",
]

keywords = ["mcp", "kaufda", "angebote", "prospekte", "einkaufsliste", "claude"]

[project.urls]
Repository = "https://github.com/vertexitde/kaufda-mcp"
Issues = "https://github.com/vertexitde/kaufda-mcp/issues"

[project.scripts]
kaufda-mcp = "kaufda_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaufda_mcp"]
